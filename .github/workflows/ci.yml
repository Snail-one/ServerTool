name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The workflow name separates standalone CI from release calls, so a normal
# push cannot cancel tests required by a release of the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go for formatting
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./*.go internal)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Set up Go for compatibility checks
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install nftables integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 iputils-ping procps

      - name: Test nftables in isolated network namespaces
        run: go test -tags=integration -exec 'sudo -n' ./internal/firewall/forward -run '^TestNftablesForwardingIntegration$' -count=1
