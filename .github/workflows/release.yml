name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.tag_name || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: snailtool_linux_amd64
          - goos: linux
            goarch: arm64
            artifact: snailtool_linux_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${{ inputs.tag_name || github.ref_name }}"
          case "${VERSION}" in
            *[!A-Za-z0-9._-]*) echo "Unsupported version for artifact filename: ${VERSION}" >&2; exit 1 ;;
          esac
          COMMIT="${GITHUB_SHA}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X snail_tool/internal/version.Version=${VERSION} -X snail_tool/internal/version.Commit=${COMMIT} -X snail_tool/internal/version.BuildDate=${BUILD_DATE}"
          go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${{ matrix.artifact }}_${VERSION}" ./cmd/snail_tool

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}_${{ env.RELEASE_VERSION }}
          path: dist/${{ matrix.artifact }}_${{ env.RELEASE_VERSION }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum snailtool_* > "checksums_${RELEASE_TAG}.txt"

      - name: Generate release notes from commits
        env:
          TARGET_SHA: ${{ github.sha }}
        run: bash scripts/generate_release_notes.sh "${RUNNER_TEMP}/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: release-assets/*
